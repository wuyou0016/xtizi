<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="机场使用流程示意：在官网付款后得到订阅链接，导入开源客户端，客户端列出节点，选定节点后访问网站"><title>机场使用流程示意：在官网付款后得到订阅链接，导入开源客户端，客户端列出节点，选定节点后访问网站</title><style>
  svg{--bg:#f7f9ff;--card:#ffffff;--line:#c9d4f5;--ink:#14203f;--sub:#51608a;--acc:#2447d6;--accs:#e6ecff;--warn:#b45309;}
  @media (prefers-color-scheme: dark){svg{--bg:#10162b;--card:#182041;--line:#34406e;--ink:#eaf0ff;--sub:#a9b6de;--acc:#6b96ff;--accs:#202b57;--warn:#f5b85c;}}
  text{font-family:-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif;fill:var(--ink)}
  .bg{fill:var(--bg)}
  .card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .accbox{fill:var(--accs);stroke:var(--acc);stroke-width:1.5}
  .ttl{font-size:20px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15px}
  .s{font-size:13.5px;fill:var(--sub)}
  .acc{fill:var(--acc)}
  .warn{fill:var(--warn)}
  .ln{stroke:var(--acc);stroke-width:2.2;fill:none}
  .lnl{stroke:var(--line);stroke-width:1.5;fill:none}
  .num{font-size:15px;font-weight:700;fill:var(--acc)}
  </style><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect class="bg" width="960" height="270"/><text class="ttl" x="34" y="44">买机场之后，你实际拿到和用到的东西</text><rect class="card" x="34" y="78" width="154.4" height="118" rx="14" filter="url(#sh)"/><text class="h" x="111.2" y="116" text-anchor="middle">机场官网</text><text class="s" x="111.2" y="142" text-anchor="middle">注册账号</text><text class="s" x="111.2" y="161" text-anchor="middle">选套餐、付款</text><path class="ln" d="M193.4 137 L213.4 137"/><path class="ln" d="M205.50175694298665 132.68517015256216 L213.4 137 L205.50175694298665 141.31482984743784"/><rect class="accbox" x="218.4" y="78" width="154.4" height="118" rx="14" /><text class="h" x="295.6" y="116" text-anchor="middle">订阅链接</text><text class="s" x="295.6" y="142" text-anchor="middle">等同账号凭证</text><text class="s" x="295.6" y="161" text-anchor="middle">不要分享给别人</text><path class="ln" d="M377.8 137 L397.8 137"/><path class="ln" d="M389.90175694298665 132.68517015256216 L397.8 137 L389.90175694298665 141.31482984743784"/><rect class="card" x="402.8" y="78" width="154.4" height="118" rx="14" filter="url(#sh)"/><text class="h" x="480" y="116" text-anchor="middle">开源客户端</text><text class="s" x="480" y="142" text-anchor="middle">把订阅导入</text><text class="s" x="480" y="161" text-anchor="middle">通用客户端</text><path class="ln" d="M562.2 137 L582.2 137"/><path class="ln" d="M574.3017569429867 132.68517015256216 L582.2 137 L574.3017569429867 141.31482984743784"/><rect class="card" x="587.2" y="78" width="154.4" height="118" rx="14" filter="url(#sh)"/><text class="h" x="664.4000000000001" y="116" text-anchor="middle">节点列表</text><text class="s" x="664.4000000000001" y="142" text-anchor="middle">多个地区的</text><text class="s" x="664.4000000000001" y="161" text-anchor="middle">出口服务器</text><path class="ln" d="M746.6 137 L766.6 137"/><path class="ln" d="M758.7017569429867 132.68517015256216 L766.6 137 L758.7017569429867 141.31482984743784"/><rect class="card" x="771.6" y="78" width="154.4" height="118" rx="14" filter="url(#sh)"/><text class="h" x="848.8000000000001" y="116" text-anchor="middle">访问网站</text><text class="s" x="848.8000000000001" y="142" text-anchor="middle">经所选节点</text><text class="s" x="848.8000000000001" y="161" text-anchor="middle">转发出去</text><text class="s" x="34" y="236">机场卖给你的三样东西：一条订阅链接、一份按周期重置的流量额度、一张节点列表。机场本身不是软件，也不是一台服务器。</text></svg>