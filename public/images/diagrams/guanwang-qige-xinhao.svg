<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="核对机场官网真假的七个信号清单：完整域名、基准地址、小锁含义、页面链接、注册时间、收款方、是否要求安装来路不明的东西"><title>核对机场官网真假的七个信号清单：完整域名、基准地址、小锁含义、页面链接、注册时间、收款方、是否要求安装来路不明的东西</title><style>
  svg{--bg:#f7f9ff;--card:#ffffff;--line:#c9d4f5;--ink:#14203f;--sub:#51608a;--acc:#2447d6;--accs:#e6ecff;--warn:#b45309;}
  @media (prefers-color-scheme: dark){svg{--bg:#10162b;--card:#182041;--line:#34406e;--ink:#eaf0ff;--sub:#a9b6de;--acc:#6b96ff;--accs:#202b57;--warn:#f5b85c;}}
  text{font-family:-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif;fill:var(--ink)}
  .bg{fill:var(--bg)}
  .card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .accbox{fill:var(--accs);stroke:var(--acc);stroke-width:1.5}
  .ttl{font-size:20px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15px}
  .s{font-size:13.5px;fill:var(--sub)}
  .acc{fill:var(--acc)}
  .warn{fill:var(--warn)}
  .ln{stroke:var(--acc);stroke-width:2.2;fill:none}
  .lnl{stroke:var(--line);stroke-width:1.5;fill:none}
  .num{font-size:15px;font-weight:700;fill:var(--acc)}
  </style><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect class="bg" width="960" height="360"/><text class="ttl" x="34" y="44">核对机场官网真假：七个自己能观察到的信号</text><rect class="card" x="34" y="70" width="436" height="50" rx="14" filter="url(#sh)"/><circle cx="61" cy="95" r="14" class="accbox"/><text class="num" x="61" y="100" text-anchor="middle">1</text><text class="b" x="88" y="101">完整域名：从左到右逐字符读</text><rect class="card" x="490" y="70" width="436" height="50" rx="14" filter="url(#sh)"/><circle cx="517" cy="95" r="14" class="accbox"/><text class="num" x="517" y="100" text-anchor="middle">2</text><text class="b" x="544" y="101">基准地址：和第一次确认的官网地址对照</text><rect class="card" x="34" y="132" width="436" height="50" rx="14" filter="url(#sh)"/><circle cx="61" cy="157" r="14" class="accbox"/><text class="num" x="61" y="162" text-anchor="middle">3</text><text class="b" x="88" y="163">小锁只代表加密，不是真假依据</text><rect class="card" x="490" y="132" width="436" height="50" rx="14" filter="url(#sh)"/><circle cx="517" cy="157" r="14" class="accbox"/><text class="num" x="517" y="162" text-anchor="middle">4</text><text class="b" x="544" y="163">页面里的条款、隐私、联系方式、下载链接是否一致</text><rect class="card" x="34" y="194" width="436" height="50" rx="14" filter="url(#sh)"/><circle cx="61" cy="219" r="14" class="accbox"/><text class="num" x="61" y="224" text-anchor="middle">5</text><text class="b" x="88" y="225">域名注册时间：刚注册的要提高警惕</text><rect class="card" x="490" y="194" width="436" height="50" rx="14" filter="url(#sh)"/><circle cx="517" cy="219" r="14" class="accbox"/><text class="num" x="517" y="224" text-anchor="middle">6</text><text class="b" x="544" y="225">收款方：和之前订单上的是否一致</text><rect class="card" x="34" y="256" width="892" height="50" rx="14" filter="url(#sh)"/><circle cx="61" cy="281" r="14" class="accbox"/><text class="num" x="61" y="286" text-anchor="middle">7</text><text class="b" x="88" y="287">是否要求关闭安全软件、装来路不明的东西</text><text class="s" x="34" y="338">七项里只要有一项对不上，就不要继续输入；核对不了的时候，宁可先不登录。</text></svg>